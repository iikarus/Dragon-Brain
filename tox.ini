[tox]
envlist = pulse, gate, forge, hammer, polish, contracts, lint-warnings
isolated_build = True

[testenv:contracts]
description = Run the Dragon Brain architectural contract scanner
allowlist_externals = python
commands =
    python -c "print('\n[1/1] Contract Scanner...')"
    python scripts/trace_contracts_dragon.py src/claude_memory --baseline 13

[testenv:integration]
description = Run integration tests against real Docker containers via Testcontainers
allowlist_externals = python
setenv =
    RUN_INTEGRATION = 1
deps =
    pytest
    pytest-asyncio
    testcontainers>=4.0.0,<5.0.0
commands =
    python -c "print('\n[1/1] Integration Tests...')"
    pytest tests/integration -m integration -v {posargs}

[testenv]
allowlist_externals = poetry, python

# Tier 0: The Pulse (Fast, Frequent)
[testenv:pulse]
description = Run fast checks: Ruff (lint/format), Mypy, Pytest (Unit)
allowlist_externals = python
deps =
    ruff
    mypy
    pytest
    pytest-asyncio
    pytest-cov
    pytest-randomly
    hypothesis
    pre-commit
commands =
    python -c "print('\n[1/4] Ruff lint...')"
    ruff check src tests
    python -c "print('\n[2/4] Ruff format...')"
    ruff format --check src tests
    python -c "print('\n[3/4] Mypy...')"
    mypy src
    python -c "print('\n[4/4] Pytest + coverage...')"
    pytest tests/unit tests/gauntlet -m "not slow and not integration" --cov=claude_memory --cov=dashboard --cov-report=term-missing --cov-fail-under=90 {posargs}

# Tier 1: The Gate (Correctness, Pre-Commit)
[testenv:gate]
description = Run correctness checks: Hypothesis (Property), Diff-Cover
allowlist_externals = python
deps =
    hypothesis
    diff-cover
    pytest
    pytest-asyncio
    pytest-cov
    pytest-randomly
commands =
    python -c "print('\n[1/2] Pytest + Hypothesis...')"
    pytest tests/unit tests/gauntlet -m "not slow and not integration" --hypothesis-profile=ci --cov=claude_memory --cov=dashboard --cov-report=xml {posargs}
    python -c "print('\n[2/2] Diff-cover...')"
    diff-cover coverage.xml --compare-branch=master --fail-under=100

# Tier 2: The Forge (Mutation Testing)
[testenv:forge]
description = Mutation testing — finds edge cases by injecting faults
allowlist_externals = python
deps =
    mutatest
    pytest
    pytest-asyncio
    pytest-cov
    hypothesis
commands =
    python -c "print('\n[1/1] Mutatest...')"
    python scripts/run_mutatest.py -s src -t "pytest tests/unit tests/gauntlet -m 'not slow and not integration'" --rseed 42 -n 10

# Tier 3: The Hammer (Brutal, Scheduled)
[testenv:hammer]
description = Run deep analysis: Security Linting, Dependency Audit, Secret Scanning
allowlist_externals = python
deps =
    bandit
    pip-audit
    detect-secrets
commands =
    python -c "print('\n[1/3] Bandit (security lint)...')"
    bandit -r src -s B101,B104,B112,B404,B602,B603,B607 -q

    python -c "print('\n[2/3] Pip-audit (dependency check)...')"
    pip-audit --ignore-vuln CVE-2026-1703 --ignore-vuln CVE-2025-69872 --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-34444 --ignore-vuln GHSA-rf74-v2fm-23pw --ignore-vuln CVE-2026-33231

    python -c "print('\n[3/3] Detect-secrets...')"
    detect-secrets scan src

# Tier 4: The Polish (Documentation, Typos)
[testenv:polish]
description = Run polish checks: Codespell, Docstr-coverage
allowlist_externals = python
deps =
    codespell
    docstr-coverage
commands =
    python -c "print('\n[1/2] Codespell...')"
    codespell src tests
    python -c "print('\n[2/2] Docstr-coverage...')"
    docstr-coverage src -v 2

# Async warning regression suite (subprocess-based strict gate)
[testenv:lint-warnings]
description = Strict-warning regression suite (subprocess pytest under -W error::RuntimeWarning)
allowlist_externals = python
deps =
    pytest
    pytest-asyncio
    pytest-randomly
commands =
    python -c "print('\n[1/1] Async warning regression...')"
    pytest tests/lint/ -q {posargs}
